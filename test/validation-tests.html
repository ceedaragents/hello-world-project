<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Validation Tests</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .pass {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .fail {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        h1 {
            color: #333;
        }
        button {
            background: #5a67d8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #4c51bf;
        }
        #results {
            margin-top: 20px;
        }
        .summary {
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Scrabble Word Validation Test Suite</h1>
        <button onclick="runTests()">Run Tests</button>
        <div id="results"></div>
    </div>

    <script>
        // Simple test framework
        const testResults = [];
        
        async function runTests() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Loading dictionary and running tests...</p>';
            testResults.length = 0;
            
            // Load dictionary
            const dictionary = await loadDictionary();
            
            if (!dictionary) {
                resultsDiv.innerHTML = '<div class="test-result fail">Failed to load dictionary</div>';
                return;
            }
            
            // Test basic word validation
            testWordValidation(dictionary);
            
            // Test edge cases
            testEdgeCases(dictionary);
            
            // Test performance
            testPerformance(dictionary);
            
            // Display results
            displayResults();
        }
        
        async function loadDictionary() {
            try {
                const response = await fetch('../data/sowpods.txt');
                const text = await response.text();
                const words = text.trim().split('\n').map(w => w.toUpperCase().trim());
                return new Set(words);
            } catch (error) {
                console.error('Failed to load dictionary:', error);
                return null;
            }
        }
        
        function testWordValidation(dictionary) {
            // Valid words that should be in dictionary
            const validWords = ['HELLO', 'WORLD', 'SCRABBLE', 'GAME', 'TEST', 'WORD'];
            validWords.forEach(word => {
                const result = dictionary.has(word);
                testResults.push({
                    name: `Valid word: "${word}"`,
                    passed: result,
                    expected: true,
                    actual: result
                });
            });
            
            // Invalid words that shouldn't be in dictionary
            const invalidWords = ['ZZZZZ', 'XXXXX', 'ABCDEFGHIJK', 'NOTAWORD'];
            invalidWords.forEach(word => {
                const result = dictionary.has(word);
                testResults.push({
                    name: `Invalid word: "${word}"`,
                    passed: !result,
                    expected: false,
                    actual: result
                });
            });
        }
        
        function testEdgeCases(dictionary) {
            // Test two-letter words
            const twoLetterWords = ['AA', 'AB', 'AD', 'AE', 'AG', 'AH', 'AI', 'AL', 'AM', 'AN'];
            twoLetterWords.forEach(word => {
                const result = dictionary.has(word);
                testResults.push({
                    name: `Two-letter word: "${word}"`,
                    passed: result === true,
                    expected: true,
                    actual: result
                });
            });
            
            // Test case sensitivity
            const mixedCase = 'HeLLo';
            const result = dictionary.has(mixedCase.toUpperCase());
            testResults.push({
                name: `Case sensitivity test: "${mixedCase}"`,
                passed: result === true,
                expected: true,
                actual: result
            });
            
            // Test empty and single character
            testResults.push({
                name: 'Empty string validation',
                passed: !dictionary.has(''),
                expected: false,
                actual: dictionary.has('')
            });
            
            testResults.push({
                name: 'Single character validation',
                passed: !dictionary.has('A'),
                expected: false,
                actual: dictionary.has('A')
            });
        }
        
        function testPerformance(dictionary) {
            // Test lookup performance
            const testWord = 'TESTING';
            const iterations = 100000;
            
            const startTime = performance.now();
            for (let i = 0; i < iterations; i++) {
                dictionary.has(testWord);
            }
            const endTime = performance.now();
            const totalTime = endTime - startTime;
            const avgTime = totalTime / iterations;
            
            testResults.push({
                name: `Performance: ${iterations} lookups`,
                passed: totalTime < 1000, // Should complete in less than 1 second
                expected: '< 1000ms',
                actual: `${totalTime.toFixed(2)}ms (${avgTime.toFixed(4)}ms per lookup)`
            });
            
            // Test dictionary size
            testResults.push({
                name: 'Dictionary size',
                passed: dictionary.size > 260000,
                expected: '> 260,000 words',
                actual: `${dictionary.size} words`
            });
        }
        
        function displayResults() {
            const resultsDiv = document.getElementById('results');
            let html = '<h2>Test Results</h2>';
            
            let passed = 0;
            let failed = 0;
            
            testResults.forEach(result => {
                if (result.passed) {
                    passed++;
                    html += `<div class="test-result pass">✓ ${result.name} - Expected: ${result.expected}, Got: ${result.actual}</div>`;
                } else {
                    failed++;
                    html += `<div class="test-result fail">✗ ${result.name} - Expected: ${result.expected}, Got: ${result.actual}</div>`;
                }
            });
            
            const summaryClass = failed === 0 ? 'pass' : 'fail';
            html += `<div class="summary ${summaryClass}">
                Total: ${testResults.length} tests | 
                Passed: ${passed} | 
                Failed: ${failed}
            </div>`;
            
            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
