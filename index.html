<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive multiplayer HTML5 Scrabble game">
    <title>Scrabble Game</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="container">
        <header>
            <h1 class="game-title">Scrabble Game</h1>
        </header>
        
        <section class="welcome-section">
            <p class="welcome-message">
                Welcome to Scrabble! Get ready to challenge your vocabulary and strategic thinking skills.
            </p>
        </section>
        
        <div id="game-container" class="game-container">
            <!-- Game board and components will be dynamically loaded here -->
            <p class="placeholder-text">Game board will appear here</p>
        </div>
        
        <div id="tile-rack-container" class="tile-rack-container">
            <div class="tile-rack-wrapper">
                <h3 class="rack-title">Your Tiles</h3>
                <div id="tile-rack" class="tile-rack">
                    <!-- Tiles will be dynamically loaded here -->
                </div>
                <div class="game-controls">
                    <button id="draw-tiles-btn" class="game-btn">Draw Tiles</button>
                    <button id="shuffle-tiles-btn" class="game-btn">Shuffle</button>
                </div>
            </div>
        </div>
    </main>
    
    <script src="js/game.js"></script>
</body>
</html>
